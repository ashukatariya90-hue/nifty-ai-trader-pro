
name: NIFTY AI TRADER PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android source and JVM targets
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {"""
              )
          p.write_text(s)

          m = Path("app/src/main/java/com/example/niftyaitrader/MainActivity.kt")
          code = m.read_text()
          imp = "import androidx.compose.runtime.Composable"
          if imp not in code:
              code = code.replace(
                  "package com.example.niftyaitrader",
                  "package com.example.niftyaitrader\n\n" + imp
              )
          m.write_text(code)
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NIFTY-AI-TRADER-PRO-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
