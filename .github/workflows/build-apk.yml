name: Build NIFTY AI TRADER PRO V6.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract merged V6.0 Phase 3 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="NIFTY_AI_TRADER_PRO_V6_0_PHASE3_ANDROID_INTEGRATION.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Upload $ZIP_FILE to the repository root first."
            exit 1
          fi
          mkdir -p /tmp/nifty-project
          unzip -q "$ZIP_FILE" -d /tmp/nifty-project
          PROJECT_DIR="/tmp/nifty-project/NIFTY_AI_TRADER_PRO_V5"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/backend/app/main.py"
          cp -a "$PROJECT_DIR"/. .
          test -f "backend/app/main.py"
          test -f "render.yaml"
          test -f "app/src/main/AndroidManifest.xml"

      - name: Commit extracted source files for backend deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/workflows/build-apk.yml || true
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Sync NIFTY AI TRADER PRO V6.0 Phase 3 sources [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run backend regression tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest -q backend/tests

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PAPI_BASE_URL="https://nifty-ai-trader-pro.onrender.com" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-AI-TRADER-PRO-V6-0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
