name: Build NIFTY AI TRADER PRO V7.0 Compatible APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NIFTY_AI_TRADER_PRO_V7_0_INTEGRATED_SOURCE.zip"
      - ".github/workflows/build-v7.0-compatible.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract integrated V7.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="NIFTY_AI_TRADER_PRO_V7_0_INTEGRATED_SOURCE.zip"
          test -f "$ZIP_FILE"
          mkdir -p /tmp/nifty-v7
          unzip -q "$ZIP_FILE" -d /tmp/nifty-v7
          PROJECT_DIR="/tmp/nifty-v7/NIFTY_AI_TRADER_PRO_V5"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/backend/app/main.py"
          cp -a "$PROJECT_DIR"/. .
          test -f "app/src/main/AndroidManifest.xml"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend regression tests
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pytest -q backend/tests

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      # Cached debug key preserves the same test signature between runs in this repo.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: nifty-ai-trader-pro-debug-signing-v1

      - name: Create debug signing key if not cached
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [ ! -f .ci/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore .ci/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Gradle to use stable debug key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if ".ci/debug.keystore" not in s:
              marker = "    buildFeatures { compose = true; buildConfig = true }"
              replacement = '''    signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".ci/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              buildFeatures { compose = true; buildConfig = true }'''
              if marker not in s:
                  raise SystemExit("Expected buildFeatures marker not found")
              p.write_text(s.replace(marker, replacement, 1))
          if ".ci/debug.keystore" not in p.read_text():
              raise SystemExit("Stable debug signing configuration missing")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify app identity and version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.example.niftyaitrader"' app/build.gradle.kts
          grep -q 'versionCode = 70' app/build.gradle.kts
          grep -q 'versionName = "7.0.0-alpha1"' app/build.gradle.kts

      - name: Build V7.0 debug APK
        run: gradle --no-daemon --stacktrace -PAPI_BASE_URL="https://nifty-ai-trader-pro.onrender.com" assembleDebug

      - name: Upload V7.0 compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-AI-TRADER-PRO-V7.0-compatible-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
