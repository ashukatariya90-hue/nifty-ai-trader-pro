name: Build V7.1.0 Automatic Ledger Migration APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V7.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="NIFTY_AI_TRADER_PRO_V7_1_0_AUTO_MIGRATION.zip"
          test -f "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          PROJECT="source/NIFTY_AI_TRADER_PRO_V5"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          cp -a "$PROJECT"/. .
          grep -q 'migratePaperLedgerIfNeeded' app/src/main/java/com/example/niftyaitrader/MainActivity.kt
          ! grep -q 'LedgerBackupScreen\|backupCreateLauncher\|backupRestoreLauncher' app/src/main/java/com/example/niftyaitrader/MainActivity.kt
          grep -q 'versionCode = 72' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Reuses the same cached debug keystore key used by the V7.0.1 workflow.
      - name: Restore V7 stable debug signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: nifty-trader-v7-debug-signing-v1

      - name: Verify signing key is available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .ci/debug.keystore ]; then
            echo '::error::The V7.0.1 signing keystore was not restored. Do not generate a new key, because Android will reject an in-place update.'
            exit 1
          fi

      - name: Configure V7.1.0 signing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildFeatures { compose = true; buildConfig = true }'
          signing = '''    signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file(".ci/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          '''
          if '.ci/debug.keystore' not in s:
              if marker not in s:
                  raise SystemExit('Gradle signing insertion point not found')
              s = s.replace(marker, signing + marker, 1)
          if 'versionCode = 72' not in s or 'versionName = "7.1.0"' not in s:
              raise SystemExit('Unexpected app version; refusing to build')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PAPI_BASE_URL=https://nifty-ai-trader-pro.onrender.com assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-AI-TRADER-PRO-V7.1.0-auto-migration
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
